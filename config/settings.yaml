project:
  target_stocks: ['VCB', 'CTG', 'AGR', 'ACB']
  global_assets: ['^GSPC', 'GC=F', '^DJI']

kafka:
  server: "localhost:9092"
  topic: "stock_ticks_v1"

storage:
  hdfs_base: "file:///home/hungluu12/Work/Projects/VietnamBankPredictML/data_lake"
  raw_zone: "raw_ticks"
  processed_zone: "processed_features"
  model_zone: "models"
  checkpoint_zone: "checkpoints"

database:
  postgres_url: "jdbc:postgresql://localhost:5432/stock_db"
  postgres_user: "hungluu12"
  postgres_pass: "hungluu12"
  redis_host: "localhost"
  redis_port: 6379
  jdbc_driver_path: "org.postgresql.Driver"

spark:
  app_name: "StockPredictEngine"
  master: "local[*]"
  packages: "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0"

model:
  train_test_split: 0.8
  features: ['close', 'volume', 'returns_1d', 'lag_1d', 'sma_20', 'sma_50', 'ema_50', '_GSPC_lag_1d', 'GC_F_lag_1d', '_DJI_lag_1d']
