[build-system]
requires      = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name    = "vietnam-bank-predict-ml"
version = "0.1.0"
description = "From-scratch linear-regression stack for Vietnamese bank stocks"
readme      = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "black",
    "mypy",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["core"]
include = ["core*"]

[tool.setuptools.package-dir]
"" = "core"

[tool.setuptools.packages.find]
where = ["data"]
include = ["data*"]

[tool.setuptools.package-dir]
"" = "data"

[tool.setuptools.packages.find]
where = ["api"]
include = ["api*"]

[tool.setuptools.package-dir]
"" = "api"

[project.scripts]
train     = "scripts.train:main"
backtest  = "scripts.backtest:main"
