[tool.poetry]
name = "stock-prediction-platform"
version = "2.0.0"
description = "Hệ thống dự đoán giá cổ phiếu ngân hàng Việt Nam."
authors = ["Lưu Thái Hưng <hungluu344@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"

numpy = "^1.26.0"
pandas = "^2.1.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"

[tool.poetry.group.ingestion.dependencies]
vnstock = "^0.5.0"
yfinance = "^0.2.30"
# Thêm DB driver (vd: psycopg2-binary, motor...)
psycopg2-binary = { version = "^2.9.9", optional = true } # Ví dụ cho Postgres

# === Group: API Service Module ===
[tool.poetry.group.api.dependencies]
fastapi = "^0.104.0"
uvicorn = { version = "^0.24.0", extras = ["standard"] }
pydantic = "^2.5.0"

# === Group: Streaming Module ===
[tool.poetry.group.streaming.dependencies]
confluent-kafka = "^2.3.0" # Hoặc kafka-python

# === Group: Development & Testing ===
[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
httpx = "^0.25.0" # Dùng để test API (thay cho requests)
black = "^23.10.0" # Code formatter
ruff = "^0.1.3"   # Linter siêu nhanh
mypy = "^1.6.0"   # Type checker

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"
