[tool.poetry]
name = "vietnambankpredictml"
version = "4.0.0"
description = "Big Data Pipeline for Vietnam Stock Prediction using PySpark, Kafka, and Delta Lake"
authors = ["Luu Thai Hung <hungluu344@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"

pyspark = "3.5.0"
delta-spark = "3.0.0"
pyarrow = "^14.0.1"

kafka-python = "^2.0.2"

yfinance = "^0.2.36"
vnstock = "^0.2.8"
pandas = "^2.1.4"
numpy = "^1.26.3"

redis = "^5.0.1"
psycopg2-binary = "^2.9.9"
SQLAlchemy = "^2.0.25"

fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.6"

pyyaml = "^6.0.1"
loguru = "^0.7.2"
python-dotenv = "^1.0.0"

scikit-learn = "^1.4.0"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
notebook = "^7.0.7"
black = "^24.1.1"
isort = "^5.13.2"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
